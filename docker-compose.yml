# Local Postgres shared by the studio and the render worker (queue mode).
#   docker compose up -d postgres
#   DATABASE_URL=postgres://proofcut:proofcut@localhost:5432/proofcut pnpm dev
#   DATABASE_URL=postgres://proofcut:proofcut@localhost:5432/proofcut pnpm worker
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: proofcut
      POSTGRES_PASSWORD: proofcut
      POSTGRES_DB: proofcut
    ports:
      - "5432:5432"
    volumes:
      - proofcut-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofcut"]
      interval: 5s
      retries: 10

volumes:
  proofcut-pg:
